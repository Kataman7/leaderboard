services:
  app:
    build: .
    container_name: boardscores-app
    expose:
      - "8000"
    networks:
      - proxy
    volumes:
      - ./data:/app/data
      - ./app:/app/app
    environment:
      - DATABASE_PATH=/app/data/boardgames.db
      - UPLOAD_DIR=/app/data/uploads
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    restart: unless-stopped

networks:
  proxy:
    external: true
